<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1600" height="1000" fill="#E9E4D8"/>
  <rect x="80" y="60" width="380" height="860" rx="16" fill="#FFFFFF"/>
  <text x="110" y="112" font-size="18" font-weight="700" fill="#6B7A72" letter-spacing="2">SEGMENTS</text>
  <g font-size="20">
    <rect x="100" y="140" width="340" height="80" rx="10" fill="#152A24"/><text x="124" y="176" font-weight="800" fill="#FEF4DE">Utilities</text><text x="124" y="204" font-size="17" fill="#F5B923">This email</text>
    <rect x="100" y="236" width="340" height="80" rx="10" fill="#F7F3EA"/><text x="124" y="272" font-weight="800" fill="#152A24">Data centers</text><text x="124" y="300" font-size="17" fill="#6B7A72">Uptime and power quality</text>
    <rect x="100" y="332" width="340" height="80" rx="10" fill="#F7F3EA"/><text x="124" y="368" font-weight="800" fill="#152A24">Commercial buildings</text><text x="124" y="396" font-size="17" fill="#6B7A72">Submetering and billing</text>
    <rect x="100" y="428" width="340" height="80" rx="10" fill="#F7F3EA"/><text x="124" y="464" font-weight="800" fill="#152A24">Distributors</text><text x="124" y="492" font-size="17" fill="#6B7A72">Launch kits and pricing</text>
  </g>
  <text x="110" y="580" font-size="18" font-weight="700" fill="#6B7A72" letter-spacing="2">PERSONALIZED BY</text>
  <g font-size="19" fill="#3E4C46"><text x="110" y="620">· Industry and job role</text><text x="110" y="656">· Products they own</text><text x="110" y="692">· Pages they visited</text></g>
  <rect x="520" y="60" width="1000" height="860" rx="16" fill="#FFFFFF"/>
  <text x="560" y="110" font-size="18" fill="#6B7A72">Subject:</text><text x="650" y="110" font-size="20" font-weight="700" fill="#152A24">Sam, a faster way to spot grid issues at your substations</text>
  <line x1="560" y1="136" x2="1480" y2="136" stroke="#EDE6D6" stroke-width="2"/>
  <rect x="560" y="160" width="920" height="280" rx="12" fill="#152A24"/>
  <text x="600" y="220" font-size="18" font-weight="700" fill="#F5B923" letter-spacing="3">FOR UTILITIES</text>
  <text x="600" y="290" font-size="44" font-weight="800" fill="#FEF4DE">Find the fault before</text>
  <text x="600" y="346" font-size="44" font-weight="800" fill="#FEF4DE">your customers do</text>
  <text x="600" y="396" font-size="21" fill="#C9D2CC">New power quality monitoring for distribution networks</text>
  <text x="560" y="500" font-size="22" fill="#152A24">Hi Sam,</text>
  <text x="560" y="544" font-size="21" fill="#3E4C46">You've been reading about voltage monitoring, so here's our newest meter,</text>
  <text x="560" y="578" font-size="21" fill="#3E4C46">built for utility teams who need answers in minutes, not days.</text>
  <rect x="560" y="620" width="290" height="120" rx="10" fill="#F7F3EA"/><text x="584" y="670" font-size="20" font-weight="800" fill="#152A24">Real-time alerts</text><text x="584" y="704" font-size="17" fill="#6B7A72">Sags, swells, harmonics</text>
  <rect x="875" y="620" width="290" height="120" rx="10" fill="#F7F3EA"/><text x="899" y="670" font-size="20" font-weight="800" fill="#152A24">Utility-grade</text><text x="899" y="704" font-size="17" fill="#6B7A72">Built for substations</text>
  <rect x="1190" y="620" width="290" height="120" rx="10" fill="#F7F3EA"/><text x="1214" y="670" font-size="20" font-weight="800" fill="#152A24">Case study</text><text x="1214" y="704" font-size="17" fill="#6B7A72">See it in the field</text>
  <rect x="560" y="780" width="300" height="60" rx="8" fill="#F5B923"/><text x="710" y="818" font-size="21" font-weight="800" fill="#152A24" text-anchor="middle">Book a demo</text>

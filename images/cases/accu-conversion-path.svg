<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#152A24"/></marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9AA39E"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#F7F3EA"/>
  <text x="60" y="78" font-size="32" font-weight="800" fill="#152A24">Conversion path</text>
  <text x="60" y="114" font-size="21" fill="#6B7A72">How a technical buyer moves from first search to a quote request, and where each step is measured</text>

  <!-- stage labels -->
  <g font-size="14" font-weight="700" fill="#6B7A72" letter-spacing="2">
    <text x="60" y="176">1 · ENTRY</text><text x="370" y="176">2 · LEARN</text><text x="680" y="176">3 · EVALUATE</text><text x="990" y="176">4 · DECIDE</text><text x="1300" y="176">5 · CONVERT</text>
  </g>
  <line x1="60" y1="192" x2="1540" y2="192" stroke="#E3DACA" stroke-width="2"/>

  <!-- 1 ENTRY: four sources, each tagged -->
  <g font-size="17">
    <rect x="60" y="222" width="250" height="78" rx="12" fill="#FFFFFF" stroke="#E6DFD0" stroke-width="2"/>
    <text x="80" y="254" font-weight="700" fill="#152A24">Organic search</text><text x="80" y="282" font-size="14" font-family="Consolas, monospace" fill="#6B7A72">google / organic</text>
    <rect x="60" y="316" width="250" height="78" rx="12" fill="#FFFFFF" stroke="#E6DFD0" stroke-width="2"/>
    <text x="80" y="348" font-weight="700" fill="#152A24">Google Ads</text><text x="80" y="376" font-size="14" font-family="Consolas, monospace" fill="#6B7A72">google / cpc</text>
    <rect x="60" y="410" width="250" height="78" rx="12" fill="#FFFFFF" stroke="#E6DFD0" stroke-width="2"/>
    <text x="80" y="442" font-weight="700" fill="#152A24">LinkedIn</text><text x="80" y="470" font-size="14" font-family="Consolas, monospace" fill="#6B7A72">linkedin / social</text>
    <rect x="60" y="504" width="250" height="78" rx="12" fill="#FFFFFF" stroke="#E6DFD0" stroke-width="2"/>
    <text x="80" y="536" font-weight="700" fill="#152A24">Email newsletter</text><text x="80" y="564" font-size="14" font-family="Consolas, monospace" fill="#6B7A72">hubspot / email</text>
  </g>
  <g fill="none" stroke="#9AA39E" stroke-width="2" marker-end="url(#ahs)">
    <path d="M310 261 C340 261 340 330 366 330"/>
    <path d="M310 355 C335 355 340 345 366 345"/>
    <path d="M310 449 C340 449 345 470 366 470"/>
    <path d="M310 543 C345 543 330 400 676 400" stroke-dasharray="6 6"/>
  </g>

  <!-- 2 LEARN -->
  <rect x="370" y="222" width="270" height="200" rx="14" fill="#FFFFFF" stroke="#E6DFD0" stroke-width="2"/>
  <text x="390" y="252" font-size="13" font-weight="700" fill="#2F6B37" letter-spacing="1.5">BLOG ARTICLE</text>
  <text x="390" y="284" font-size="19" font-weight="700" fill="#152A24">What causes harmonics</text>
  <text x="390" y="308" font-size="19" font-weight="700" fill="#152A24">in data centers?</text>
  <rect x="390" y="326" width="230" height="10" rx="5" fill="#EDE6D6"/><rect x="390" y="346" width="200" height="10" rx="5" fill="#EDE6D6"/>
  <text x="390" y="390" font-size="15" fill="#1A5FB4" text-decoration="underline">Monitoring power quality →</text>
  <rect x="370" y="440" width="270" height="142" rx="14" fill="#FFFFFF" stroke="#E6DFD0" stroke-width="2"/>
  <text x="390" y="470" font-size="13" font-weight="700" fill="#2F6B37" letter-spacing="1.5">HOW-TO GUIDE</text>
  <text x="390" y="502" font-size="19" font-weight="700" fill="#152A24">Choosing a meter for</text>
  <text x="390" y="526" font-size="19" font-weight="700" fill="#152A24">critical facilities</text>
  <text x="390" y="562" font-size="15" fill="#1A5FB4" text-decoration="underline">Compare solutions →</text>

  <!-- 3 EVALUATE -->
  <rect x="680" y="270" width="270" height="270" rx="14" fill="#FFFFFF" stroke="#E6DFD0" stroke-width="2"/>
  <text x="700" y="300" font-size="13" font-weight="700" fill="#8A6410" letter-spacing="1.5">SOLUTION PAGE</text>
  <text x="700" y="332" font-size="19" font-weight="700" fill="#152A24">Data center power</text>
  <text x="700" y="356" font-size="19" font-weight="700" fill="#152A24">monitoring</text>
  <rect x="700" y="374" width="230" height="10" rx="5" fill="#EDE6D6"/><rect x="700" y="394" width="190" height="10" rx="5" fill="#EDE6D6"/>
  <rect x="700" y="420" width="104" height="70" rx="8" fill="#F7F3EA"/><rect x="814" y="420" width="116" height="70" rx="8" fill="#F7F3EA"/>
  <text x="712" y="448" font-size="13" font-weight="700" fill="#152A24">Uptime risk</text><text x="826" y="448" font-size="13" font-weight="700" fill="#152A24">Use case</text>
  <rect x="700" y="502" width="150" height="26" rx="13" fill="#152A24"/><text x="775" y="520" font-size="13" font-weight="700" fill="#F5B923" text-anchor="middle">See the meter</text>

  <!-- 4 DECIDE -->
  <rect x="990" y="222" width="270" height="360" rx="14" fill="#FFFFFF" stroke="#E6DFD0" stroke-width="2"/>
  <text x="1010" y="252" font-size="13" font-weight="700" fill="#B5462E" letter-spacing="1.5">PRODUCT PAGE</text>
  <text x="1010" y="284" font-size="19" font-weight="700" fill="#152A24">Power quality meter</text>
  <rect x="1010" y="302" width="230" height="96" rx="8" fill="#EEF2EF"/>
  <rect x="1090" y="322" width="70" height="56" rx="6" fill="#152A24"/><rect x="1102" y="332" width="46" height="22" rx="3" fill="#F5B923" fill-opacity=".8"/>
  <rect x="1010" y="412" width="230" height="10" rx="5" fill="#EDE6D6"/><rect x="1010" y="432" width="180" height="10" rx="5" fill="#EDE6D6"/>
  <rect x="1010" y="460" width="230" height="38" rx="8" fill="#F5B923"/><text x="1125" y="485" font-size="16" font-weight="800" fill="#152A24" text-anchor="middle">Request a quote</text>
  <rect x="1010" y="508" width="110" height="34" rx="8" fill="none" stroke="#152A24" stroke-width="2"/><text x="1065" y="530" font-size="13" font-weight="700" fill="#152A24" text-anchor="middle">Datasheet</text>
  <rect x="1130" y="508" width="110" height="34" rx="8" fill="none" stroke="#152A24" stroke-width="2"/><text x="1185" y="530" font-size="13" font-weight="700" fill="#152A24" text-anchor="middle">Talk to sales</text>
  <text x="1010" y="568" font-size="13" fill="#6B7A72">Ad landing page for "pq meter" keywords</text>

  <!-- 5 CONVERT -->
  <rect x="1300" y="222" width="240" height="170" rx="14" fill="#152A24"/>
  <text x="1320" y="252" font-size="13" font-weight="700" fill="#F5B923" letter-spacing="1.5">QUOTE FORM</text>
  <rect x="1320" y="268" width="200" height="24" rx="5" fill="#2A443B"/><rect x="1320" y="300" width="200" height="24" rx="5" fill="#2A443B"/><rect x="1320" y="332" width="200" height="24" rx="5" fill="#2A443B"/>
  <text x="1330" y="285" font-size="12" fill="#9FB0A8">Company</text><text x="1330" y="317" font-size="12" fill="#9FB0A8">Application</text><text x="1330" y="349" font-size="12" fill="#9FB0A8">Quantity &amp; timeline</text>
  <text x="1320" y="378" font-size="12" fill="#C9D2CC">Short form: 6 fields</text>
  <rect x="1300" y="412" width="240" height="170" rx="14" fill="#FFFFFF" stroke="#FF7A59" stroke-width="2"/>
  <text x="1320" y="442" font-size="13" font-weight="700" fill="#D9573A" letter-spacing="1.5">HUBSPOT CRM</text>
  <g font-size="15" fill="#152A24">
    <text x="1320" y="474">✓ Contact created</text>
    <text x="1320" y="500">✓ Source: google / cpc</text>
    <text x="1320" y="526">✓ Lifecycle: Lead → MQL</text>
    <text x="1320" y="552">✓ Sales rep notified</text>
  </g>

  <!-- main path arrows with labels -->
  <g fill="none" stroke="#152A24" stroke-width="2.5" marker-end="url(#ah)">
    <path d="M640 380 C660 380 660 390 676 390"/>
    <path d="M640 545 C670 545 660 470 676 470"/>
    <path d="M950 470 C970 470 970 470 986 470"/>
    <path d="M1260 479 C1280 479 1280 300 1296 300"/>
    <path d="M1420 392 L1420 408"/>
  </g>
  <g font-size="13" font-weight="700" fill="#152A24">
    <rect x="618" y="590" width="148" height="28" rx="14" fill="#FFFFFF" stroke="#152A24"/><text x="692" y="609" text-anchor="middle">Internal link</text>
    <rect x="906" y="590" width="128" height="28" rx="14" fill="#FFFFFF" stroke="#152A24"/><text x="970" y="609" text-anchor="middle">Solution CTA</text>
    <rect x="1212" y="590" width="132" height="28" rx="14" fill="#F5B923"/><text x="1278" y="609" text-anchor="middle">Primary CTA</text>
  </g>

  <!-- measurement band -->
  <rect x="60" y="660" width="1480" height="270" rx="18" fill="#FFFFFF" stroke="#E6DFD0" stroke-width="2"/>
  <text x="96" y="708" font-size="14" font-weight="700" fill="#6B7A72" letter-spacing="2">HOW EACH STEP IS MEASURED</text>
  <g font-size="17">
    <text x="96" y="756" font-weight="800" fill="#152A24">UTM on every link</text>
    <text x="96" y="784" fill="#6B7A72">Every ad, post and email is tagged,</text>
    <text x="96" y="808" fill="#6B7A72">so each lead traces back to its source.</text>
    <text x="470" y="756" font-weight="800" fill="#152A24">GA4 key events</text>
    <g font-family="Consolas, monospace" font-size="15" fill="#152A24">
      <rect x="470" y="772" width="160" height="28" rx="6" fill="#F7F3EA"/><text x="482" y="791">quote_request</text>
      <rect x="640" y="772" width="190" height="28" rx="6" fill="#F7F3EA"/><text x="652" y="791">datasheet_download</text>
      <rect x="470" y="808" width="120" height="28" rx="6" fill="#F7F3EA"/><text x="482" y="827">call_click</text>
      <rect x="600" y="808" width="160" height="28" rx="6" fill="#F7F3EA"/><text x="612" y="827">sales_contact</text>
    </g>
    <text x="900" y="756" font-weight="800" fill="#152A24">Message match</text>
    <text x="900" y="784" fill="#6B7A72">Keyword, ad headline and landing-page</text>
    <text x="900" y="808" fill="#6B7A72">headline make the same promise.</text>
    <text x="1250" y="756" font-weight="800" fill="#152A24">Monthly review</text>
    <text x="1250" y="784" fill="#6B7A72">Drop-off between steps shows</text>
    <text x="1250" y="808" fill="#6B7A72">where to test the page next.</text>
  </g>
  <line x1="96" y1="860" x2="1504" y2="860" stroke="#EFE9DC" stroke-width="2"/>
  <text x="96" y="896" font-size="16" fill="#6B7A72">Path shown for a data center buyer. The same structure ran for submetering, EV charging and code-compliance products.</text>
</svg>

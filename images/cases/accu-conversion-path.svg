<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <text x="40" y="50" font-size="22" font-weight="700" fill="#333333">Conversion path: one buyer, 14 days</text>
  <text x="40" y="78" font-size="15" fill="#777777">Sample scenario · facility engineer at a colocation data center · branches run clockwise 1 → 4</text>

  <!-- connectors: center to hubs -->
  <g stroke-width="3" fill="none">
    <line x1="700" y1="440" x2="560" y2="306" stroke="#F0A060"/>
    <line x1="900" y1="440" x2="1040" y2="306" stroke="#7CC060"/>
    <line x1="900" y1="540" x2="1040" y2="694" stroke="#6C9BD8"/>
    <line x1="700" y1="540" x2="560" y2="694" stroke="#D65C5C"/>
  </g>

  <!-- 1 ENTRY (orange) -->
  <g stroke="#F0A060" stroke-width="2.5" fill="none">
    <line x1="430" y1="278" x2="350" y2="139"/><line x1="430" y1="278" x2="350" y2="229"/><line x1="430" y1="278" x2="350" y2="319"/><line x1="430" y1="278" x2="350" y2="409"/>
  </g>
  <rect x="430" y="246" width="200" height="64" rx="10" fill="#F9D2AE" stroke="#F0A060" stroke-width="2.5"/>
  <text x="530" y="273" font-size="17" font-weight="700" fill="#333" text-anchor="middle">1 · Entry</text>
  <text x="530" y="295" font-size="13" fill="#7A4A1E" text-anchor="middle">Day 1</text>
  <g font-size="14.5" fill="#333" text-anchor="middle">
    <rect x="40" y="108" width="310" height="62" rx="10" fill="#FCE3CC" stroke="#F0A060" stroke-width="2"/><text x="195" y="132" font-weight="700">Googles a problem</text><text x="195" y="154" font-size="13" fill="#666">"harmonics tripping UPS breaker"</text>
    <rect x="40" y="198" width="310" height="62" rx="10" fill="#FCE3CC" stroke="#F0A060" stroke-width="2"/><text x="195" y="222" font-weight="700">Lands on our blog (organic)</text><text x="195" y="244" font-size="12.5" font-family="Consolas, monospace" fill="#666">utm: google / organic</text>
    <rect x="40" y="288" width="310" height="62" rx="10" fill="#FCE3CC" stroke="#F0A060" stroke-width="2"/><text x="195" y="312" font-weight="700">Sees a LinkedIn post</text><text x="195" y="334" font-size="13" fill="#666">UPS harmonics carousel, shared by a colleague</text>
    <rect x="40" y="378" width="310" height="62" rx="10" fill="#FCE3CC" stroke="#F0A060" stroke-width="2"/><text x="195" y="402" font-weight="700">Ignores the first search ad</text><text x="195" y="424" font-size="13" fill="#666">Still learning, not ready to buy</text>
  </g>

  <!-- 2 LEARN & EVALUATE (green) -->
  <g stroke="#7CC060" stroke-width="2.5" fill="none">
    <line x1="1170" y1="278" x2="1250" y2="139"/><line x1="1170" y1="278" x2="1250" y2="229"/><line x1="1170" y1="278" x2="1250" y2="319"/><line x1="1170" y1="278" x2="1250" y2="409"/>
  </g>
  <rect x="970" y="246" width="200" height="64" rx="10" fill="#D4EFC4" stroke="#7CC060" stroke-width="2.5"/>
  <text x="1070" y="273" font-size="17" font-weight="700" fill="#333" text-anchor="middle">2 · Learn &amp; evaluate</text>
  <text x="1070" y="295" font-size="13" fill="#3E6B2A" text-anchor="middle">Days 2–10</text>
  <g font-size="14.5" fill="#333" text-anchor="middle">
    <rect x="1250" y="108" width="310" height="62" rx="10" fill="#E6F6DC" stroke="#7CC060" stroke-width="2"/><text x="1405" y="132" font-weight="700">Downloads the how-to guide</text><text x="1405" y="154" font-size="13" fill="#666">Becomes a HubSpot contact</text>
    <rect x="1250" y="198" width="310" height="62" rx="10" fill="#E6F6DC" stroke="#7CC060" stroke-width="2"/><text x="1405" y="222" font-weight="700">Gets a 3-email nurture</text><text x="1405" y="244" font-size="13" fill="#666">Use cases, installation, case study</text>
    <rect x="1250" y="288" width="310" height="62" rx="10" fill="#E6F6DC" stroke="#7CC060" stroke-width="2"/><text x="1405" y="312" font-weight="700">Visits the solution page 3×</text><text x="1405" y="334" font-size="13" fill="#666">Data center power monitoring</text>
    <rect x="1250" y="378" width="310" height="62" rx="10" fill="#E6F6DC" stroke="#7CC060" stroke-width="2"/><text x="1405" y="402" font-weight="700">Watches the product video</text><text x="1405" y="424" font-size="13" fill="#666">Linked from the article and the email</text>
  </g>

  <!-- 3 DECIDE (blue) -->
  <g stroke="#6C9BD8" stroke-width="2.5" fill="none">
    <line x1="1170" y1="722" x2="1250" y2="589"/><line x1="1170" y1="722" x2="1250" y2="679"/><line x1="1170" y1="722" x2="1250" y2="769"/><line x1="1170" y1="722" x2="1250" y2="859"/>
  </g>
  <rect x="970" y="690" width="200" height="64" rx="10" fill="#D3E1F5" stroke="#6C9BD8" stroke-width="2.5"/>
  <text x="1070" y="717" font-size="17" font-weight="700" fill="#333" text-anchor="middle">3 · Decide</text>
  <text x="1070" y="739" font-size="13" fill="#2F5583" text-anchor="middle">Days 11–14</text>
  <g font-size="14.5" fill="#333" text-anchor="middle">
    <rect x="1250" y="558" width="310" height="62" rx="10" fill="#E4EDFA" stroke="#6C9BD8" stroke-width="2"/><text x="1405" y="582" font-weight="700">Searches with buying intent</text><text x="1405" y="604" font-size="13" fill="#666">"class a power quality meter" → clicks the ad</text>
    <rect x="1250" y="648" width="310" height="62" rx="10" fill="#E4EDFA" stroke="#6C9BD8" stroke-width="2"/><text x="1405" y="672" font-weight="700">Compares models on the product page</text><text x="1405" y="694" font-size="13" fill="#666">Ad headline matches the page headline</text>
    <rect x="1250" y="738" width="310" height="62" rx="10" fill="#E4EDFA" stroke="#6C9BD8" stroke-width="2"/><text x="1405" y="762" font-weight="700">Sends the datasheet onward</text><text x="1405" y="784" font-size="13" fill="#666">To the electrical contractor for sign-off</text>
    <rect x="1250" y="828" width="310" height="62" rx="10" fill="#E4EDFA" stroke="#6C9BD8" stroke-width="2"/><text x="1405" y="852" font-weight="700">Clicks "Request a quote"</text><text x="1405" y="874" font-size="13" fill="#666">From the product page, day 14</text>
  </g>

  <!-- 4 CONVERT & TRACK (red) -->
  <g stroke="#D65C5C" stroke-width="2.5" fill="none">
    <line x1="430" y1="722" x2="350" y2="589"/><line x1="430" y1="722" x2="350" y2="679"/><line x1="430" y1="722" x2="350" y2="769"/><line x1="430" y1="722" x2="350" y2="859"/>
  </g>
  <rect x="430" y="690" width="200" height="64" rx="10" fill="#F4B9B9" stroke="#D65C5C" stroke-width="2.5"/>
  <text x="530" y="717" font-size="17" font-weight="700" fill="#333" text-anchor="middle">4 · Convert &amp; track</text>
  <text x="530" y="739" font-size="13" fill="#8A2E2E" text-anchor="middle">Day 14</text>
  <g font-size="14.5" fill="#333" text-anchor="middle">
    <rect x="40" y="558" width="310" height="62" rx="10" fill="#FADADA" stroke="#D65C5C" stroke-width="2"/><text x="195" y="582" font-weight="700">Submits the quote form</text><text x="195" y="604" font-size="13" fill="#666">12 meters · install planned for next quarter</text>
    <rect x="40" y="648" width="310" height="62" rx="10" fill="#FADADA" stroke="#D65C5C" stroke-width="2"/><text x="195" y="672" font-weight="700">HubSpot records the journey</text><text x="195" y="694" font-size="13" fill="#666">First touch: organic · last touch: Google Ads</text>
    <rect x="40" y="738" width="310" height="62" rx="10" fill="#FADADA" stroke="#D65C5C" stroke-width="2"/><text x="195" y="762" font-weight="700">Becomes an MQL</text><text x="195" y="784" font-size="13" fill="#666">Routed to the regional sales rep</text>
    <rect x="40" y="828" width="310" height="62" rx="10" fill="#FADADA" stroke="#D65C5C" stroke-width="2"/><text x="195" y="852" font-weight="700">Rep follows up within 24 h</text><text x="195" y="874" font-size="12.5" font-family="Consolas, monospace" fill="#666">GA4: quote_request logged</text>
  </g>

  <!-- center -->
  <rect x="640" y="420" width="320" height="140" rx="14" fill="#E8D3E8" stroke="#9C5A9C" stroke-width="3"/>
  <text x="800" y="466" font-size="22" font-weight="700" fill="#333" text-anchor="middle">Qualified lead</text>
  <text x="800" y="494" font-size="14.5" fill="#555" text-anchor="middle">Facility engineer · colocation data center</text>
  <text x="800" y="518" font-size="14.5" fill="#555" text-anchor="middle">Quote for 12 power quality meters</text>
  <text x="800" y="542" font-size="12.5" fill="#7A5A7A" text-anchor="middle">4 channels · 14 days · first search to quote</text>

  <text x="40" y="960" font-size="14" fill="#888">Illustrative journey built from the real path: content earned the first visit, nurture built trust, search ads captured the decision.</text>
</svg>
